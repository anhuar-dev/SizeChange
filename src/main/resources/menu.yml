list:
  title: "<dark_gray>Online Players <gray>({page}/{total_pages})"
  rows: 6

  fill:
    material: GRAY_STAINED_GLASS_PANE
    name: "<reset>"

  # Slots where player heads are placed (everything else is filled with "fill").
  content:
    start-slot: 0
    end-slot: 44

  player-head:
    name: "<yellow>{player}"
    lore:
      - "<gray>Permanent size: <white>{size}</white>"
      - "<gray>Temporary active: <white>{has_temp}</white>"
      - "<gray>Temporary size: <white>{temp_size}</white>"
      - "<gray>Time remaining: <white>{remaining}</white>"

  navigation:
    previous:
      slot: 48
      material: ARROW
      disabled-material: GRAY_STAINED_GLASS_PANE
      name: "<gray>« Previous"
    next:
      slot: 50
      material: ARROW
      disabled-material: GRAY_STAINED_GLASS_PANE
      name: "<gray>Next »"
    info:
      slot: 49
      material: PAPER
      name: "<yellow>Online players: <white>{total_players}</white>"
      lore:
        - "<gray>Page <white>{page}</white>/<white>{total_pages}</white>"

  empty:
    slot: 22
    material: BARRIER
    name: "<red>No players online"

region-config-select:
  title: "<dark_gray>Configure Overrides"
  rows: 3

  fill:
    material: GRAY_STAINED_GLASS_PANE
    name: "<reset>"

  # Red items = DENY (grouped on the left), blue items = SIZE (grouped on the
  # right). Region + world of each kind sit next to each other.
  deny-button:
    slot: 10
    material: BARRIER
    name: "<red>DENY-REGION"
    lore:
      - "<gray>Regions that force"
      - "<gray><white>1.0</white> size on entry"
      - ""
      - "<yellow>Click to manage"

  world-deny-button:
    slot: 11
    material: RED_BED
    name: "<red>DENY-WORLD"
    lore:
      - "<gray>Worlds that force"
      - "<gray><white>1.0</white> size while inside"
      - ""
      - "<yellow>Click to manage"

  size-button:
    slot: 15
    material: BLUE_DYE
    name: "<blue>SIZE-REGION"
    lore:
      - "<gray>Regions that force a"
      - "<gray>specific size on entry"
      - ""
      - "<yellow>Click to manage"

  world-size-button:
    slot: 16
    material: LAPIS_LAZULI
    name: "<blue>SIZE-WORLD"
    lore:
      - "<gray>Worlds that force a"
      - "<gray>specific size while inside"
      - ""
      - "<yellow>Click to manage"

region-config:
  title: "<dark_gray>{type} <gray>({page}/{total_pages})"
  rows: 6

  fill:
    material: GRAY_STAINED_GLASS_PANE
    name: "<reset>"

  content:
    start-slot: 0
    end-slot: 44

  deny-entry:
    material: BARRIER
    name: "<red>{name}"
    lore:
      - "<gray>Type: <white>{type}</white>"
      - "<gray>Forces <white>1.0</white> size while inside"
      - ""
      - "<yellow>Click to remove (asks for confirmation)"

  size-entry:
    material: PAPER
    name: "<yellow>{name}"
    lore:
      - "<gray>Type: <white>{type}</white>"
      - "<gray>Forces <white>{size}</white> size while inside"
      - ""
      - "<yellow>Click to remove (asks for confirmation)"

  confirm-delete:
    title: "<red>Delete '{region}'?"
    rows: 3
    info:
      slot: 13
      material: PAPER
      name: "<yellow>{region}"
      lore:
        - "<gray>This action cannot be undone."
    cancel:
      slot: 11
      material: LIME_STAINED_GLASS_PANE
      name: "<green>✔ Cancel"
      lore:
        - "<gray>Keep this region configured"
    confirm:
      slot: 15
      material: RED_STAINED_GLASS_PANE
      name: "<red>✘ Delete permanently"
      lore:
        - "<gray>Removes this region from setting.yml"

  add:
    slot: 49
    material: LIME_DYE
    name: "<green>+ Add {type}"
    lore:
      - "<gray>Click to add a new"
      - "<gray>entry to {type}"

  back:
    slot: 45
    material: ARROW
    name: "<gray>← Back"
    lore:
      - "<gray>Choose another region type"

  navigation:
    previous:
      slot: 48
      material: ARROW
      disabled-material: GRAY_STAINED_GLASS_PANE
      name: "<gray>« Previous"
    next:
      slot: 50
      material: ARROW
      disabled-material: GRAY_STAINED_GLASS_PANE
      name: "<gray>Next »"
