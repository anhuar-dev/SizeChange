list:
  title: "<dark_gray>Jugadores conectados <gray>({page}/{total_pages})"
  rows: 6

  fill:
    material: GRAY_STAINED_GLASS_PANE
    name: "<reset>"

  # Slots donde se colocan las cabezas de jugador (el resto se rellena con "fill").
  content:
    start-slot: 0
    end-slot: 44

  player-head:
    name: "<yellow>{player}"
    lore:
      - "<gray>Tamaño permanente: <white>{size}</white>"
      - "<gray>Temporal activo: <white>{has_temp}</white>"
      - "<gray>Tamaño temporal: <white>{temp_size}</white>"
      - "<gray>Tiempo restante: <white>{remaining}</white>"

  navigation:
    previous:
      slot: 48
      material: ARROW
      disabled-material: GRAY_STAINED_GLASS_PANE
      name: "<gray>« Anterior"
    next:
      slot: 50
      material: ARROW
      disabled-material: GRAY_STAINED_GLASS_PANE
      name: "<gray>Siguiente »"
    info:
      slot: 49
      material: PAPER
      name: "<yellow>Jugadores online: <white>{total_players}</white>"
      lore:
        - "<gray>Página <white>{page}</white>/<white>{total_pages}</white>"

  empty:
    slot: 22
    material: BARRIER
    name: "<red>No hay jugadores conectados"

region-config-select:
  title: "<dark_gray>Configurar Regiones"
  rows: 3

  fill:
    material: GRAY_STAINED_GLASS_PANE
    name: "<reset>"

  deny-button:
    slot: 11
    material: BARRIER
    name: "<red>DENY-REGION"
    lore:
      - "<gray>Regiones que fuerzan tamaño"
      - "<gray><white>1.0</white> al entrar"
      - ""
      - "<yellow>Click para gestionar"

  size-button:
    slot: 15
    material: PAPER
    name: "<yellow>SIZE-REGION"
    lore:
      - "<gray>Regiones que fuerzan un tamaño"
      - "<gray>específico al entrar"
      - ""
      - "<yellow>Click para gestionar"

region-config:
  title: "<dark_gray>{type} <gray>({page}/{total_pages})"
  rows: 6

  fill:
    material: GRAY_STAINED_GLASS_PANE
    name: "<reset>"

  content:
    start-slot: 0
    end-slot: 44

  deny-entry:
    material: BARRIER
    name: "<red>{region}"
    lore:
      - "<gray>Tipo: <white>DENY-REGION</white>"
      - "<gray>Fuerza tamaño <white>1.0</white> al entrar"
      - ""
      - "<yellow>Click para eliminar (pide confirmación)"

  size-entry:
    material: PAPER
    name: "<yellow>{region}"
    lore:
      - "<gray>Tipo: <white>SIZE-REGION</white>"
      - "<gray>Fuerza tamaño <white>{size}</white> al entrar"
      - ""
      - "<yellow>Click para eliminar (pide confirmación)"

  confirm-delete:
    title: "<red>¿Eliminar '{region}'?"
    rows: 3
    info:
      slot: 13
      material: PAPER
      name: "<yellow>{region}"
      lore:
        - "<gray>Esta acción no se puede deshacer."
    cancel:
      slot: 11
      material: LIME_STAINED_GLASS_PANE
      name: "<green>✔ Cancelar"
      lore:
        - "<gray>Mantener esta región configurada"
    confirm:
      slot: 15
      material: RED_STAINED_GLASS_PANE
      name: "<red>✘ Eliminar permanentemente"
      lore:
        - "<gray>Quita esta región de setting.yml"

  add:
    slot: 49
    material: LIME_DYE
    name: "<green>+ Agregar {type}"
    lore:
      - "<gray>Click para agregar una nueva"
      - "<gray>entrada a {type}"

  back:
    slot: 45
    material: ARROW
    name: "<gray>← Volver"
    lore:
      - "<gray>Elegir otro tipo de región"

  navigation:
    previous:
      slot: 48
      material: ARROW
      disabled-material: GRAY_STAINED_GLASS_PANE
      name: "<gray>« Anterior"
    next:
      slot: 50
      material: ARROW
      disabled-material: GRAY_STAINED_GLASS_PANE
      name: "<gray>Siguiente »"
