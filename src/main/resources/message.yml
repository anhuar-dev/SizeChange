help:
  - "<gold><bold>SizeChange Plugin</bold>"
  - "<yellow>/sizechange permanent set <player> <size> <gray>- Change permanent size"
  - "<yellow>/sizechange permanent reset <player> <gray>- Reset size to normal"
  - "<yellow>/sizechange temporary set <player> <size> <duration> <gray>- Apply a temporary size"
  - "<yellow>/sizechange temporary clear <player> <gray>- Cancel temporary size"
  - "<yellow>/sizechange temporary extend <player> <duration> <gray>- Add time to a temporary size"
  - "<yellow>/sizechange combat check|clear <player> <gray>- Inspect or remove a combat tag"
  - "<yellow>/sizechange view <player> <gray>- View current size"
  - "<yellow>/sizechange list <gray>- Open the online players menu"
  - "<yellow>/sizechange info <gray>- View plugin diagnostics"
  - "<yellow>/sizechange config <gray>- Open the region/world override menu"
  - "<yellow>/sizechange reload <gray>- Reload configuration"
  - "<gray>Valid size: 0.0625 - 16.0"
  - "<gray>Durations: 30s, 5m, 2h, 1d"

size-set: "<green>✓ <white>{player}</white>'s size set to <white>{size}</white>"
size-reset: "<green>✓ <white>{player}</white>'s size reset to normal (1.0)"
size-view:
  - "<gold><bold>Size Information</bold></gold>"
  - "<yellow>Player: <white>{player}</white>"
  - "<yellow>Size: <white>{size}</white>"
size-view-temp:
  - "<gold><bold>Size Information</bold></gold>"
  - "<yellow>Player: <white>{player}</white>"
  - "<yellow>Permanent size: <white>{size}</white>"
  - "<aqua>Temporary size: <white>{temp_size}</white>"
  - "<aqua>Time remaining: <white>{remaining}</white>"
size-changed: "<yellow>Your size has been changed to <white>{size}</white>"

temp-size-set: "<green>✓ <white>{player}</white>'s temporary size set to <white>{size}</white> for <white>{duration}</white>"
temp-size-applied: "<yellow>You've been given a temporary size of <white>{size}</white> for <white>{duration}</white>"
temp-size-cleared: "<green>✓ <white>{player}</white>'s temporary size cancelled and restored"
temp-size-expired: "<yellow>Your temporary size has expired. Restored to <white>{size}</white>"
temp-size-restored: "<yellow>Your temporary size has been restored: <white>{size}</white>"
temp-size-extended: "<green>✓ <white>{player}</white>'s temporary size extended by <white>{duration}</white> (<white>{remaining}</white> left)"
temp-size-extended-target: "<yellow>Your temporary size was extended by <white>{duration}</white> (<white>{remaining}</white> left)"
temp-size-none: "<red>✗ <white>{player}</white> has no active temporary size"

combat-tagged: "<red>⚔ You are now in combat for <white>{seconds}s</white>"
combat-untagged: "<green>✓ You are no longer in combat"
combat-actionbar: "<red>⚔ Combat <gray>·</gray> <white>{seconds}s</white>"
combat-bossbar: "<red>⚔ Combat <white>{seconds}s</white>"
combat-check-tagged: "<yellow><white>{player}</white> is in combat (<white>{seconds}s</white> left)"
combat-check-untagged: "<yellow><white>{player}</white> is not in combat"
combat-cleared: "<green>✓ Cleared <white>{player}</white>'s combat tag"
combat-not-tagged: "<red>✗ <white>{player}</white> is not in combat"

player-not-found: "<red>✗ Player <white>{player}</white> is not online"
invalid-duration: "<red>✗ Invalid duration. Use format: 30s, 5m, 2h, 1d"
error-loading-data: "<red>✗ Error loading player data. Try again."
gui-console-only: "<red>✗ This command can only be run in-game."

info:
  - "<gold><bold>SizeChange</bold> <gray>v{version}</gray>"
  - "<yellow>Database: <white>{database}</white>"
  - "<yellow>Active temporary sizes: <white>{active_temp}</white>"
  - "<yellow>Configured regions: <white>{regions}</white>"
  - "<yellow>Configured worlds: <white>{worlds}</white>"
  - "<yellow>Players in combat: <white>{combat}</white>"

config-add-prompt-name: "<yellow>Type the region name."
config-add-prompt-world: "<yellow>Type the world name."
config-add-invalid-name: "<red>✗ Invalid name. It can't be empty or contain a dot (.)."
config-add-duplicate: "<red>✗ <white>{name}</white> is already configured."
config-add-region-not-found-warning: "<gray>⚠ No region named <white>{region}</white> was found in any loaded world. It was saved anyway — double-check the name."
config-add-world-not-found-warning: "<gray>⚠ No world named <white>{world}</white> is loaded. It was saved anyway — double-check the name."
config-add-prompt-size: "<yellow>Type the size (0.0625 - 16.0)."
config-add-invalid-size: "<red>✗ Invalid size. Must be a number between 0.0625 and 16.0."
config-deny-added: "<green>✓ '{region}' added to DENY-REGION."
config-deny-removed: "<green>✓ '{region}' removed from DENY-REGION."
config-size-added: "<green>✓ '{region}' added to SIZE-REGION with size {size}."
config-size-removed: "<green>✓ '{region}' removed from SIZE-REGION."
config-world-deny-added: "<green>✓ '{world}' added to DENY-WORLD."
config-world-deny-removed: "<green>✓ '{world}' removed from DENY-WORLD."
config-world-size-added: "<green>✓ '{world}' added to SIZE-WORLD with size {size}."
config-world-size-removed: "<green>✓ '{world}' removed from SIZE-WORLD."
config-combat-excluded-added: "<green>✓ '{region}' added to the combat exclusions."
config-combat-excluded-removed: "<green>✓ '{region}' removed from the combat exclusions."
config-combat-duration-prompt: "<yellow>Type the combat duration in seconds (1 - 3600)."
config-combat-size-prompt: "<yellow>Type the combat size (0.0625 - 16.0)."
config-effects-sound-prompt: "<yellow>Type a sound name (e.g. ENTITY_SLIME_SQUISH)."
config-effects-particle-prompt: "<yellow>Type a particle name (e.g. POOF)."
config-effects-duration-prompt: "<yellow>Type the animation length in ticks (10 - 200, 20 = 1 second)."
config-value-saved: "<green>✓ Saved: <white>{value}</white>"
config-value-invalid: "<red>✗ Invalid value."
config-input-cancelled: "<gray>Cancelled."

reload: "<green>✓ Configuration reloaded successfully"
