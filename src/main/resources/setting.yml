# Which database backend to use for storing player sizes. Must be exactly
# "SQLITE" or "MONGODB" (case-insensitive) — anything else falls back to
# SQLite with a warning in the console.
DATABASE:
  TYPE: "SQLITE"

  # Used only when TYPE is "SQLITE". Path is relative to this plugin's own
  # data folder (plugins/SizeChange/) — the "database/" subfolder (and the
  # SQLite -wal/-shm side files next to the .db) are created automatically.
  # Change this if you'd rather keep it flat as "players.db" instead.
  SQLITE:
    FILE: "database/players.db"

  # Used only when TYPE is "MONGODB". Ignored entirely while on SQLite.
  MONGODB:
    URI: "mongodb://localhost:27017"
    DATABASE: "size_plugin"
    COLLECTION: "players"
    # Separate collection for the optional ATTRIBUTES feature below.
    ATTRIBUTES-COLLECTION: "player_attributes"

# Smooth size transition for /sizechange permanent set/reset and temporary
# set/clear (~0.8s, ease-out). Set to false for an instant change instead.
# Never affects WorldGuard regions, automatic temporary-size expiration, or
# the size restored on join — those always stay instant.
ANIMATION:
  ENABLED: true

# Sound + particle played once when a command actually changes a player's size
# (same scope as ANIMATION above — never on region/world crossings or automatic
# expiration). Sound and particle are fully independent: toggle each with its own
# ENABLED, and set NAME to any valid org.bukkit.Sound / org.bukkit.Particle name.
# An invalid NAME is skipped with a console warning, not a crash.
EFFECTS:
  SOUND:
    ENABLED: true
    NAME: "ENTITY_SLIME_SQUISH"
  PARTICLE:
    ENABLED: true
    # Any org.bukkit.Particle. Bright, single-point ones read best with the drawn
    # shapes below: FLAME, SOUL_FIRE_FLAME, END_ROD, ELECTRIC_SPARK, GLOW,
    # HAPPY_VILLAGER, WAX_ON, DUST (glows cyan). POOF/CLOUD look faint.
    NAME: "FLAME"
    # Shape the particles are drawn in. Pick it in-game from /sizechange config.
    #   HELIX - full double spiral spinning around the player (default)
    #   AURA  - stacked rings rising and pulsing outward, then closing in
    #   BURST - the old one-shot puff
    STYLE: "HELIX"
    # How long HELIX/AURA last, in ticks (20 = 1 second). Ignored by BURST.
    DURATION: 50

# PvP combat tag. When two players damage each other, BOTH are put "in combat"
# for DURATION seconds; every new hit refreshes the timer. While tagged, the
# player's size is forced to SIZE (visual only — the real permanent/temporary
# size is restored when the tag runs out), and this OUTRANKS region/world size
# overrides. If either player is inside an EXCLUDED-REGIONS region when the hit
# lands, neither gets tagged (a tag already running is not cancelled by walking
# into one). Players with sizechange.bypass are never tagged.
COMBAT:
  ENABLED: true
  DURATION: 15            # seconds
  SIZE: 1.0               # forced size while in combat (0.0625 - 16.0)
  EXCLUDED-REGIONS: []    # WorldGuard region ids where PvP does NOT start a tag
  # Each output is independent — turn any of them off on its own.
  DISPLAY:
    ACTIONBAR: true
    BOSSBAR: true
    CHAT: true
  BOSSBAR:
    COLOR: "RED"          # PINK, BLUE, RED, GREEN, YELLOW, PURPLE, WHITE
    OVERLAY: "NOTCHED_10" # PROGRESS, NOTCHED_6, NOTCHED_10, NOTCHED_12, NOTCHED_20

# Optional, fully independent feature — nothing to do with the size system above.
# Apply extra Minecraft attribute modifiers (movement speed, attack damage, max
# health, knockback resistance, ...) to a player, either permanently (persisted,
# re-applied on join) or for a limited time (auto-removed on expiry) — the same
# permanent/temporary split the size system uses. Manage it in-game with
# /sizechange attribute ... (permanent set|clear, temporary set|clear|extend,
# clearall, view). Turn ENABLED off and every subcommand is refused and all
# modifiers are stripped from online players.
ATTRIBUTES:
  ENABLED: true

  # Which attributes staff may modify, by short name (movement_speed) or full key
  # (minecraft:movement_speed). An EMPTY list means "every supported attribute".
  # "scale" is ALWAYS blocked here — the size system owns it.
  # Note: lowering max_health below a player's current health is clamped by
  # vanilla (they are not killed), and health climbs back when the modifier is
  # removed.
  ALLOWED:
    - "max_health"
    - "movement_speed"
    - "attack_damage"
    - "attack_speed"
    - "armor"
    - "armor_toughness"
    - "knockback_resistance"
    - "jump_strength"
    - "safe_fall_distance"
    - "fall_damage_multiplier"
    - "block_interaction_range"
    - "entity_interaction_range"
    - "block_break_speed"
    - "step_height"
    - "luck"

  # Sanity clamp on the amount a single modifier may carry, whichever form it was
  # entered in (flat "4", percent "20%" -> 0.2, multiplier "1.5x" -> 0.5).
  MIN-AMOUNT: -1024.0
  MAX-AMOUNT: 1024.0

# List of WorldGuard region names. While a player is standing inside any of
# these, their size is forced to 1.0 (normal), overriding both their
# permanent size and any active temporary size — neither is lost, just
# hidden until they leave the region. Manage this list in-game with
# /sizechange config instead of editing it by hand if you'd rather not
# restart/reload manually.
DENY-REGION:
  - "red"
  - "blue"

# Map of WorldGuard region name -> forced size, applied the same way as
# DENY-REGION above (visual-only while inside, restored on exit, never
# written to the database) but with a specific size per region instead of
# always 1.0. Also manageable in-game via /sizechange config.
SIZE-REGION:
  green: 0.1
  yellow: 2.0

# List of world names. While a player is in any of these worlds their size is
# forced to 1.0 (normal) — exactly like DENY-REGION, but for a whole world:
# visual-only, the real permanent/temporary size is hidden (never lost, never
# written to the database) and restored on leaving the world. A DENY-REGION /
# SIZE-REGION the player is standing in always takes precedence over the world.
# Manage this list in-game with /sizechange config instead of editing by hand.
# Example:
#   DENY-WORLD:
#     - "world_nether"
DENY-WORLD: []

# Map of world name -> forced size, applied the same way as DENY-WORLD above but
# with a specific size per world instead of always 1.0. Regions still take
# precedence. Also manageable in-game via /sizechange config.
# Example:
#   SIZE-WORLD:
#     world_the_end: 0.5
SIZE-WORLD: {}
